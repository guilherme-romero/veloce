name: Syntax check

on:
  pull_request:
    branches: [main]

jobs:
  node-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: node -c em todo .js de server/
        run: |
          find server -name '*.js' -print0 | xargs -0 -n1 node -c

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20   # runner node:test estável a partir do 20
      - name: Smoke test de assets
        run: node --test tests/*.test.js
