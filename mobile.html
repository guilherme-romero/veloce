<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f12">
  <meta name="description" content="VELOCE LABS — treino de ciclismo, versão mobile.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self';
             script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com;
             style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com;
             font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com;
             img-src 'self' data: blob: https://*.cloudfront.net https://*.strava.com;
             connect-src 'self';
             worker-src 'self';
             base-uri 'self';
             form-action 'self';
             object-src 'none';"
  >

  <!-- Ver nota em index.html: depois da meta viewport e da CSP, antes do
       primeiro <link> (BUG-069). -->
  <script src="js/variant.js?v=2.9.27"></script>

  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg?v=2.9.27">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=2.9.27">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2.9.27">
  <link rel="manifest" href="manifest-mobile.json?v=2.9.27">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="css/mobile.css?v=2.9.27">
  <link rel="stylesheet" href="css/mobile-sheet.css?v=2.9.27">
  <!-- bikes.css é o do desktop: só usa tokens, que mobile.css redeclara. -->
  <link rel="stylesheet" href="css/bikes.css?v=2.9.27">
  <link rel="stylesheet" href="css/mobile-bikes.css?v=2.9.27">
  <link rel="stylesheet" href="css/mobile-desempenho.css?v=2.9.27">
  <link rel="stylesheet" href="css/mobile-treino-ia.css?v=2.9.27">

  <title>VELOCE LABS</title>
</head>
<body>

<div class="m-app">

  <header class="m-header">
    <div id="m-header-left"></div>
    <div id="m-header-actions" class="m-header-actions"></div>
  </header>

  <main class="m-scroll">
    <!-- Uma <section> por aba; o MRouter alterna o atributo hidden.
         Os ids de conteúdo são preenchidos pelos módulos js/mobile/*.js. -->
    <section id="m-view-inicio"     class="m-view" hidden aria-hidden="true"></section>
    <section id="m-view-atividades" class="m-view" hidden aria-hidden="true"></section>
    <section id="m-view-desempenho" class="m-view" hidden aria-hidden="true"></section>

    <!-- A garagem reaproveita js/bikes.js inteiro: ele só precisa destes
         ids e faz todo o resto por delegação de data-act. -->
    <section id="m-view-bikes" class="m-view" hidden aria-hidden="true">
      <div id="bikes-list"></div>
      <div id="bikes-empty" class="m-empty" hidden>
        Nenhuma bicicleta cadastrada.
        <div style="margin-top:14px">
          <button id="btn-add-bike-empty" class="m-btn m-btn-primary" type="button">
            <i class="fa-solid fa-plus"></i> Nova bike
          </button>
        </div>
      </div>
    </section>

    <!-- Insights não tem tab própria: vive dentro da tab Desempenho, via
         seletor segmentado (route.tab:'desempenho') — ver js/mobile/
         insights-mobile.js e js/mobile/shell.js (MShell.segment). Treino IA
         também não tem tab própria: vive dentro da tab Atividades, via
         seletor segmentado (route.tab:'atividades') — ver js/mobile/
         activities-mobile.js, js/mobile/treino-ia-mobile.js e
         js/mobile/shell.js (MShell.segmentAtividades). Perfil e Passeios
         seguem sem tab própria, alcançados pela aba "Mais". -->
    <section id="m-view-insights" class="m-view" hidden aria-hidden="true"></section>
    <section id="m-view-treino-ia" class="m-view" hidden aria-hidden="true"></section>
    <section id="m-view-perfil"   class="m-view" hidden aria-hidden="true"></section>
    <section id="m-view-passeios" class="m-view" hidden aria-hidden="true"></section>

    <section id="m-view-mais" class="m-view" hidden aria-hidden="true"></section>
  </main>

  <nav class="m-tabbar" aria-label="Navegação principal">
    <button class="m-tab" type="button" data-slug="bikes">
      <i class="fa-solid fa-bicycle"></i><span>Bikes</span>
    </button>
    <button class="m-tab" type="button" data-slug="atividades">
      <i class="fa-solid fa-list-check"></i><span>Ativid.</span>
    </button>
    <button class="m-tab" type="button" data-slug="inicio">
      <i class="fa-solid fa-house"></i><span>Início</span>
    </button>
    <button class="m-tab" type="button" data-slug="desempenho">
      <i class="fa-solid fa-gauge-high"></i><span>Desemp.</span>
    </button>
    <button class="m-tab" type="button" data-slug="mais">
      <i class="fa-solid fa-ellipsis"></i><span>Mais</span>
    </button>
  </nav>

</div>

<!-- ═══════════ SCRIPTS ═══════════════════════════════════════════════
     Ordem obrigatória: dados → shell → views (que se auto-registram no
     MRouter) → boot. Nenhum defer: os módulos dependem uns dos outros na
     ordem de carga, como no desktop.
     NÃO são carregados aqui: router.js, app.js, home.js, activities.js,
     insights.js, rides.js, routes.js, workouts.js, ferramentas.js,
     backup.js, heatmap.js, notifications.js, strava.js, garmin.js,
     charts.js — a UI mobile tem os próprios renders.
══════════════════════════════════════════════════════════════════════ -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>

<script src="js/version.js?v=2.9.27"></script>
<script src="js/utils.js?v=2.9.27"></script>
<script src="js/api.js?v=2.9.27"></script>
<script src="js/defaults.js?v=2.9.27"></script>
<script src="js/storage.js?v=2.9.27"></script>
<script src="js/profile.js?v=2.9.27"></script>
<script src="js/core/metrics.js?v=2.9.27"></script>
<script src="js/core/activity-stats.js?v=2.9.27"></script>
<script src="js/core/weight-stats.js?v=2.9.27"></script>
<script src="js/core/fatigue.js?v=2.9.27"></script>
<script src="js/core/records.js?v=2.9.27"></script>
<script src="js/core/weather-rating.js?v=2.9.27"></script>
<script src="js/core/training-suggestion.js?v=2.9.27"></script>

<script src="js/modals.js?v=2.9.27"></script>
<script src="js/bikes.js?v=2.9.27"></script>

<script src="js/mobile/router-mobile.js?v=2.9.27"></script>
<script src="js/mobile/shell.js?v=2.9.27"></script>
<script src="js/mobile/home-mobile.js?v=2.9.27"></script>
<script src="js/mobile/activities-mobile.js?v=2.9.27"></script>
<script src="js/mobile/insights-mobile.js?v=2.9.27"></script>
<script src="js/mobile/treino-ia-mobile.js?v=2.9.27"></script>
<script src="js/mobile/performance-analysis-mobile.js?v=2.9.27"></script>
<script src="js/mobile/comparative-performance-mobile.js?v=2.9.27"></script>
<script src="js/mobile/desempenho-mobile.js?v=2.9.27"></script>
<script src="js/mobile/bikes-mobile.js?v=2.9.27"></script>
<script src="js/mobile/profile-mobile.js?v=2.9.27"></script>
<script src="js/mobile/rides-mobile.js?v=2.9.27"></script>
<script src="js/mobile/more-mobile.js?v=2.9.27"></script>

<script src="js/mobile/boot.js?v=2.9.27"></script>
<script src="js/pwa.js?v=2.9.27"></script>

</body>
</html>
